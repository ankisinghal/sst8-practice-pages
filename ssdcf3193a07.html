 with deep sides below highlands"], "a": 2, "x": "The chapter defines plains as extensive flat or gently undulating surfaces without large hills or deep valleys.", "t": "Ch8 World Geography: Some Glimpses - Landforms", "svg": "", "cap": ""}, {"id": "SS8C08049", "q": "A landscape is mainly flat grassland without forests, with hot summers, cold winters and moderate rainfall. Which category fits?", "o": ["A dense, wet equatorial rainforest", "A temperate steppe grassland", "A permanently frozen polar ice cap", "A hot, nearly rainless desert"], "a": 1, "x": "The steppe definition describes flat unforested grassland with a temperate climate, hot summers, cold winters and moderate rainfall.", "t": "Ch8 World Geography: Some Glimpses - Asia", "svg": "", "cap": ""}, {"id": "SS8C08054", "q": "A river deposits layers of sediment over a wide area. What landform can this process help build?", "o": ["A deep trench on the ocean floor", "A rocky plateau raised by faulting", "A broad plain with fertile soil", "A steep mountain with a narrow peak"], "a": 2, "x": "The chapter says plains are vast flatlands formed by sediment deposition, with fertile soils that support farming.", "t": "Ch8 World Geography: Some Glimpses - Europe", "svg": "", "cap": ""}, {"id": "SS8C08059", "q": "In an otherwise dry desert, a small area has water and vegetation. Why is it described as an oasis?", "o": ["It has water and plants within a dry region", "It has dense rainforest across the whole desert region", "It has a deep ocean trench under the sand", "It has permanent ice beneath a hot surface"], "a": 0, "x": "An oasis is an area with water and vegetation in an otherwise dry desert. The definition, not a named caption location, settles the question.", "t": "Ch8 World Geography: Some Glimpses - Africa", "svg": "", "cap": ""}, {"id": "SS8C08090", "q": "Why can an underground dwelling help people cope with a desert climate that has hot and cold seasons?", "o": ["It brings moist ocean winds into the home in every season", "It makes the inside hotter in summer and colder during winter months", "It increases direct sunlight inside the home in every season", "It keeps the home cooler in summer and warmer in winter"], "a": 3, "x": "The chapter explains that underground dwellings in the Sahara keep houses cool in summer and warm in winter, an adaptation to temperature extremes.", "t": "Ch8 World Geography: Some Glimpses - Desert adaptations", "svg": "", "cap": ""}, {"id": "SS8V08019d", "q": "A world map labels an ocean along the northern coast of Antarctica. Which label belongs there?", "o": ["Indian Ocean", "Atlantic Ocean", "Southern Ocean", "Pacific Ocean"], "a": 2, "x": "Fig.1.5 places the Southern Ocean around Antarctica, so it lies along the continent's northern coast.", "t": "Ch8 World Geography: Some Glimpses - Oceans", "svg": "", "cap": ""}, {"id": "SS8V08023d", "q": "A submersible reaches the deepest section of the Mariana Trench. Which depth description fits that site?", "o": ["More than 11,000 metres below sea level", "2,000 to 3,000 metres below sea level", "8,000 to 9,000 metres beneath the surface of the ocean", "5,000 to 6,000 metres below sea level"], "a": 0, "x": "The chapter names the deepest section as Challenger Deep and says it reaches over 11,000 metres below sea level. The other choices are shallower than 11,000 metres.", "t": "Ch8 World Geography: Some Glimpses - Oceans", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
D.qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.innerHTML='<span class="tag">'+esc(q.t)+'</span><div class="qt"><b>'+(i+1)+". "+esc(q.q)+"</b></div>"+(q.svg?'<figure class="diagram">'+q.svg+'<figcaption>'+esc(q.cap)+"</figcaption></figure>":"")+q.o.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+L[j]+". "+esc(o)+"</label>").join("");qd.appendChild(d)});
