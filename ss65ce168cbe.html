rica"], "a": 2, "x": "The chapter says the Ural Mountains form a natural boundary between Europe and Asia.", "t": "Ch8 World Geography: Some Glimpses - Asia", "svg": "", "cap": ""}, {"id": "SS8V08019e", "q": "Why is 'Southern Ocean' a fitting name for the ocean shown around Antarctica in Fig. 1.5?", "o": ["Because it is the southern arm of the Atlantic", "Because it encircles Antarctica, the far-south continent", "Because it is the smallest and shallowest of all the oceans", "Because it borders the southern tip of India"], "a": 1, "x": "Fig. 1.5 shows the Southern Ocean encircling Antarctica and notes its penguins and seals; the name fits its far-south position around the continent.", "t": "Ch8 World Geography: Some Glimpses - Oceans", "svg": "", "cap": ""}, {"id": "SS8V08015a", "q": "The chapter asks what would happen if pollution harmed ocean plankton. Why would that matter to all living beings?", "o": ["Plankton store most of the Earth's fresh water supply", "Plankton drive the warm and cold ocean currents worldwide", "Plankton keep the oceans salty enough for sea life", "Plankton make possible almost half the oxygen we breathe"], "a": 3, "x": "The 'Think About It' box says oceans give us almost half the oxygen we breathe, made possible by tiny marine organisms such as plankton, and asks what would happen if pollution harmed them.", "t": "Ch8 World Geography: Some Glimpses - Oceans", "svg": "", "cap": ""}]};const L="ABCD";const qd=document.getElementById("qs");const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
